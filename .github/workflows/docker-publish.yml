name: Docker

on:
  push:
    branches: [ "main" ]
    # Publish semver tags as releases.
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main" ]
  schedule:
   - cron: '0 14 * * 2'

env:
  DOCKERHUB_IMAGE: riptidewave93/arm64-valheim

jobs:
  # Builds the base and every variant image with the Makefile, so CI builds
  # match local builds. Image names and variants are set in the Makefile.
  build:
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log into registry ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log into Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Scheduled runs skip the cache so the weekly build picks up new
      # Debian and box64 packages.
      - name: Build images
        run: make all ${{ github.event_name == 'schedule' && 'NO_CACHE=1' || '' }}

      - name: Push images
        if: github.event_name != 'pull_request'
        run: make push

  # Sync README.md to the Docker Hub repository description
  dockerhub-description:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_IMAGE }}
          short-description: ${{ github.event.repository.description }}
